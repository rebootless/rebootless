name: update-portfolio

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Nerd Font
        id: font-cache
        uses: actions/cache@v4
        with:
          path: /tmp/jbm.zip
          key: jetbrainsmono-nerd-font

      - name: Install VHS + ttyd + ffmpeg + jq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl unzip gnupg fontconfig jq ttyd

          curl -fsSL --max-time 20 --retry 3 --retry-delay 5 \
            https://repo.charm.sh/apt/gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg

          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list

          sudo apt-get update -qq
          sudo apt-get install -y vhs
          vhs --version

      - name: Install JetBrainsMono Nerd Font
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/fonts

          if [ ! -f /tmp/jbm.zip ]; then
            curl -fsSL --max-time 30 --retry 3 --retry-delay 5 \
              "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip" \
              -o /tmp/jbm.zip
          fi

          unzip -q -o /tmp/jbm.zip -d ~/.local/share/fonts
          fc-cache -f

      - name: Render portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERM: xterm-256color
          COLUMNS: "110"
        run: |
          set -euo pipefail
          rm -f portfolio.png.new
          timeout 180 vhs portfolio.tape || {
            echo "::error::vhs render timed out or failed"
            exit 1
          }

      - name: Verify render output
        run: |
          set -euo pipefail
          if [ ! -s portfolio.png ]; then
            echo "::error::portfolio.png missing or empty after render — aborting, old version kept"
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add portfolio.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update portfolio $(date -u +%Y-%m-%d)"

          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && break
            git rebase --abort
            sleep $((i * 5))
          done

          git push origin main